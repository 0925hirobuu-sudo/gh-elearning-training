<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>障がい者グループホーム 職員研修ポータル</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root{--bg:#F2F5F4;--ink:#22323A;--sub:#5C6E76;--ai:#1D4E6B;--deep:#16394F;--yama:#E8A33D;--card:#fff;--line:#DCE4E2;--ok:#3A7D5C}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;line-height:1.8;padding:24px 16px 56px}.wrap{max-width:920px;margin:0 auto}.top{border-bottom:3px solid var(--ai);padding-bottom:18px;margin-bottom:24px}.eyebrow{font-size:12px;color:var(--ai);font-weight:700;letter-spacing:.16em}.title{font-family:'Zen Maru Gothic',sans-serif;font-size:32px;font-weight:900;line-height:1.35;margin:6px 0}.lead{color:var(--sub);font-size:15px}.notice{background:#fff8eb;border-left:5px solid var(--yama);border-radius:0 14px 14px 0;padding:14px 16px;margin:18px 0;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(29,78,107,.06);display:flex;flex-direction:column;gap:10px}.no{font-size:12px;color:var(--ai);font-weight:900;letter-spacing:.12em}.name{font-family:'Zen Maru Gothic',sans-serif;font-size:19px;font-weight:900}.desc{font-size:13.5px;color:var(--sub);min-height:48px}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--ai);color:#fff;text-decoration:none;font-weight:700;padding:11px 18px;margin-top:auto}.btn:hover{background:var(--deep)}.qr{width:112px;height:112px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff;align-self:center}.qrrow{display:flex;gap:14px;align-items:center}.small{font-size:12px;color:var(--sub)}.tools{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.toolLinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.ghost{border:2px solid var(--ai);color:var(--ai);background:transparent}.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:28px}@media(max-width:560px){.title{font-size:25px}.qrrow{flex-direction:column;align-items:flex-start}.qr{align-self:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">GROUP HOME E-LEARNING</div>
    <h1 class="title">障がい者グループホーム<br>職員研修ポータル</h1>
    <p class="lead">動画・学習・事例・確認クイズ・受講報告まで行える研修アプリ一覧です。受講後は結果画面からGoogleフォームへ報告してください。</p>
  </header>

  <div class="notice">
    <b>管理者の方へ：</b> 02〜05の動画は mp4 ファイルを <code>apps/</code> フォルダへアップロードしてください。動画が未アップロードの場合、学習とクイズは使えますが動画は再生されません。
  </div>

  <section class="grid" id="apps"></section>

  <section class="tools">
    <h2 class="name">管理・補助ツール</h2>
    <p class="small">受講報告フォームや使い方ガイドへのリンクです。</p>
    <div class="toolLinks">
      <a class="btn ghost" href="https://docs.google.com/forms/d/e/1FAIpQLSdlbmEVyS42aKptYKJuXBNa3QIbEX1UgopzC97EG75qbqcVCw/viewform" target="_blank" rel="noopener">受講報告フォーム</a>
    </div>
  </section>

  <p class="foot">本ページをスマホで開き、各研修のQRコードを長押し保存すると掲示用にも使えます。</p>
</div>
<script>
const base = location.origin + location.pathname.replace(/index\.html$/,'');
const items = [
  ['01','虐待防止・権利擁護','利用者の尊厳を守るための基本、虐待の類型、通報義務、権利擁護を学びます。','apps/01-abuse.html'],
  ['02','身体拘束等の適正化','身体拘束の原則禁止、3要件、スピーチロック、記録の考え方を学びます。','apps/02-restraint.html'],
  ['03','感染症・食中毒予防','手指衛生、嘔吐物処理、食中毒予防、発生時対応を学びます。','apps/03-infection.html'],
  ['04','BCP業務継続計画','災害・感染症発生時にサービスを継続するための考え方を学びます。','apps/04-bcp.html'],
  ['05','非常災害対策・避難訓練','火災・地震・水害等への備え、夜間想定、避難訓練の実施を学びます。','apps/05-disaster.html'],
  ['06','新任オリエンテーション','入社時に必要な理念、守秘義務、報連相、支援の基本を学びます。','apps/06-onboarding.html']
];
const apps = document.getElementById('apps');
apps.innerHTML = items.map(([no,name,desc,path])=>{
  const url = new URL(path, base).href;
  const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=10&data=' + encodeURIComponent(url);
  return `<article class="card"><div class="no">COURSE ${no}</div><div class="name">${name}</div><p class="desc">${desc}</p><div class="qrrow"><img class="qr" src="${qr}" alt="${name} QR"><div><a class="btn" href="${path}">研修を開く</a><p class="small">QRを読み取ってスマホでも開けます。</p></div></div></article>`;
}).join('');
</script>
</body>
</html>
